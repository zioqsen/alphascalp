# ============================================================
#  render.yaml — Déploiement AlphaScalp sur Render.com
#  Render lit ce fichier automatiquement (Blueprint) : tu connectes
#  ton dépôt GitHub, Render crée le service tout seul.
#  Voir DEPLOY.md pour le pas-à-pas.
#
#  ⚠️ PLAN GRATUIT = SYSTÈME DE FICHIERS ÉPHÉMÈRE
#  Render ne permet pas de disque persistant sur le plan free. La base SQLite
#  est donc effacée à chaque redéploiement, redémarrage ou mise en veille (le
#  service s'endort après 15 min sans trafic).
#
#  [02/08] CE N'EST PLUS UN PROBLÈME. Un instantané de la table `clients` vit
#  dans un fichier du Drive de Flo : écrit à chaque changement, relu au
#  démarrage. Éprouvé six fois en production le 2 août — la base repart vide,
#  les inscrits reviennent seuls. Voir les variables GOOGLE_* plus bas.
#
#  Ce paragraphe annonçait auparavant que « les inscriptions bêta seraient
#  PERDUES » et que le filet était les logs Render. C'était vrai jusqu'à ce
#  matin-là. Troisième document de la journée à décrire un système disparu,
#  après le guide et la politique de confidentialité : quelque chose change,
#  et les textes autour ne suivent pas tout seuls.
#
#  POUR ALLER PLUS LOIN (si la bêta grossit) : plan "starter" (~7 $/mois) avec
#  le bloc disk ci-dessous, ou une base Postgres managée.
# ============================================================
services:
  - type: web
    name: alphascalp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # HOST=0.0.0.0 + $PORT : Render fournit le port, on écoute sur toutes les interfaces.
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALPHASCALP_MASTER_TOKEN
        generateValue: true         # Render génère un secret fort (le bot maître devra utiliser CETTE valeur)
      - key: ALPHASCALP_ADMIN_TOKEN
        generateValue: true         # idem pour l'accès admin

      # [30/07] Notification Telegram des inscriptions bêta.
      #
      # ⚠️ CE SERVICE EST UN BLUEPRINT : render.yaml fait AUTORITÉ. Une
      # variable ajoutée à la main dans le tableau de bord mais absente d'ici
      # est SUPPRIMÉE à la synchro suivante. C'est ce qui a fait disparaître
      # les deux variables le 30/07. Toute variable doit donc être déclarée
      # dans ce fichier, sans exception.
      #
      # Le chat ID est un simple identifiant (pas un secret) : valeur en clair,
      # comme ça il n'y a plus qu'UNE chose à saisir à la main.
      - key: ALPHASCALP_TG_CHAT_ID
        value: "1814067052"
      # Le token, lui, ne doit JAMAIS figurer ici : ce dépôt est public.
      # sync: false = Render crée la variable et demande sa valeur dans le
      # tableau de bord. Sans valeur, la notification est simplement inactive :
      # le serveur démarre et les inscriptions fonctionnent quand même.
      - key: ALPHASCALP_TG_TOKEN
        sync: false
      # [31/07] Groupe des beta-testeurs. Le prefixe -100 indique un
      # SUPERGROUPE : un groupe converti change d identifiant, et l ancien
      # devient inutilisable. C est pourquoi la recherche en renvoyait deux.
      - key: ALPHASCALP_TG_GROUPE_ID
        value: "-1003916010308"
      # Lien d invitation au groupe. Genere une fois depuis /admin puis colle
      # ici. Ce n est pas un secret : c est justement ce qu on distribue.
      - key: ALPHASCALP_TG_INVITATION
        sync: false
      # Nom du bot SANS @ (ex: alphascalp_signup_bot). Sert a construire les
      # liens profonds t.me/<bot>?start=... qui permettent a un testeur de lier
      # son Telegram et d etre prevenu a l activation de sa cle.
      - key: ALPHASCALP_TG_BOT
        sync: false

      # ── [01/08] PERSISTANCE DES INSCRITS DANS GOOGLE DRIVE ──────────
      # Le disque de ce plan est éphémère : au réveil de l'instance la table
      # `clients` est vide et toutes les clés bêta disparaissent. Ces quatre
      # variables font vivre un instantané de la table dans un fichier du
      # Drive de Flo — écrit à chaque changement, relu au démarrage.
      #
      # Elles DOIVENT figurer ici même sans valeur : ce service est un
      # Blueprint, et une variable ajoutée à la main dans le tableau de bord
      # mais absente de ce fichier est SUPPRIMÉE à la synchro suivante. C'est
      # exactement ce qui a fait disparaître deux variables le 30/07.
      #
      # `sync: false` = Render crée la variable et demande sa valeur dans le
      # tableau de bord. Les valeurs s'obtiennent avec
      # outils/obtenir_jeton_drive.py — voir outils/GUIDE_DRIVE.md.
      #
      # Tant que les quatre ne sont pas renseignées, le mécanisme reste
      # INERTE et le serveur fonctionne exactement comme avant.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_FILE_ID
        sync: false

      # ── [02/08] RÉPONDEUR DE SUPPORT DU GROUPE ──────────────────────
      # true  = il écoute et journalise ce qu'il AURAIT répondu, sans rien
      #         envoyer. C'est le réglage de départ : on lit d'abord ses
      #         réponses dans les journaux Render, on le laisse parler ensuite.
      # false = il répond dans le groupe des testeurs.
      #
      # Il ne répond que ce dont il est certain — 12 sujets, réponses écrites
      # à l'avance — et se tait sur tout le reste. Il prévient aussi quand
      # quelqu'un colle une clé ou un mot de passe dans le fil.
      #
      # PRÉREQUIS : désactiver le mode confidentialité du bot dans BotFather
      # (/setprivacy → Disable), sinon il ne voit pas les messages du groupe.
      - key: ALPHASCALP_SUPPORT_MUET
        value: "true"

    # ── Pour passer en stockage durable plus tard ──────────────────────
    # 1. remplacer  plan: free  par  plan: starter
    # 2. décommenter les 6 lignes ci-dessous
    # 3. ajouter la variable  ALPHASCALP_DB = /data/alphascalp.db
    #
    # disk:
    #   name: alphascalp-data
    #   mountPath: /data
    #   sizeGB: 1
